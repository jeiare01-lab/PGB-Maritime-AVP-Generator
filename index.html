<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PGB Maritime AVP Generator</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
    }

    .header {
      border-bottom: 1px solid #1e293b;
      padding: 20px 32px;
    }

    .header h1 {
      margin: 0 0 8px 0;
      font-size: 28px;
      font-weight: 700;
    }

    .header p {
      margin: 0;
      font-size: 14px;
      color: #94a3b8;
    }

    .container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      padding: 24px 32px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .section-title {
      font-size: 16px;
      font-weight: 600;
      margin: 0 0 16px 0;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #cbd5e1;
    }

    .scene-box {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .scene-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .scene-title h3 {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
      color: #ff8c00;
    }

    .scene-duration {
      font-size: 12px;
      color: #64748b;
    }

    textarea, input[type="text"], input[type="number"], input[type="color"], select {
      width: 100%;
      background: #0f172a;
      border: 1px solid #334155;
      color: #e2e8f0;
      padding: 8px;
      border-radius: 4px;
      font-size: 12px;
      margin-bottom: 8px;
      font-family: monospace;
    }

    textarea {
      min-height: 50px;
      resize: vertical;
    }

    input[type="color"] {
      width: 40px;
      height: 40px;
      border: none;
      padding: 2px;
      margin-right: 8px;
    }

    .color-input-group {
      display: flex;
      gap: 8px;
    }

    .button {
      width: 100%;
      background: #ff8c00;
      border: none;
      color: #fff;
      padding: 12px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .button:hover:not(:disabled) {
      background: #e07c00;
    }

    .button:disabled {
      background: #666;
      cursor: wait;
    }

    .button.success {
      background: #10b981;
    }

    .button.error {
      background: #dc2626;
    }

    .box {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .error-message {
      background: #7c2d12;
      border: 1px solid #ea580c;
      color: #fecaca;
      padding: 12px;
      border-radius: 4px;
      font-size: 13px;
      margin-top: 12px;
    }

    .output-variant {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0f172a;
      border: 1px solid #334155;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 10px;
    }

    .variant-info h4 {
      font-size: 13px;
      font-weight: 500;
      color: #e2e8f0;
      margin: 0 0 4px 0;
    }

    .variant-info p {
      font-size: 11px;
      color: #64748b;
      margin: 0;
    }

    .variant-buttons {
      display: flex;
      gap: 8px;
    }

    .small-button {
      background: #334155;
      border: none;
      color: #94a3b8;
      padding: 6px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }

    .small-button.download {
      background: #ff8c00;
      color: #fff;
    }

    .hidden {
      display: none;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .spinner {
      display: inline-block;
      animation: spin 1s linear infinite;
    }

    .left-panel {
      display: flex;
      flex-direction: column;
    }

    .right-panel {
      display: flex;
      flex-direction: column;
    }

    .scenes-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 16px;
    }

    .settings-group {
      margin-bottom: 10px;
    }

    .settings-group label {
      font-size: 12px;
      color: #94a3b8;
      display: block;
      margin-bottom: 4px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #ff8c00;
    }

    .output-section {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 16px;
    }

    .output-section h3 {
      font-size: 13px;
      font-weight: 600;
      margin: 0 0 12px 0;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #10b981;
    }

    @media (max-width: 1024px) {
      .container {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>PGB Maritime AVP Generator</h1>
    <p>Transform storyline into Motion videos</p>
  </div>

  <div class="container">
    <!-- Left Panel -->
    <div class="left-panel">
      <h2 class="section-title">Scene Composition</h2>
      <div id="scenes-container" class="scenes-container"></div>

      <div class="box">
        <h3 class="section-title">Voice Settings</h3>
        <div class="settings-group">
          <label>Voice Type</label>
          <select id="voiceType">
            <option>professional-male</option>
            <option>professional-female</option>
            <option>narrator</option>
          </select>
        </div>
        <div class="settings-group">
          <label>Speed: <span id="speedValue">1.0</span>x</label>
          <input type="range" id="voiceSpeed" min="0.8" max="1.3" step="0.1" value="1.0">
        </div>
      </div>
    </div>

    <!-- Right Panel -->
    <div class="right-panel">
      <h2 class="section-title">Generation</h2>

      <div class="box">
        <h3 class="section-title">Brand Settings</h3>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px;">
          <div>
            <label>Primary</label>
            <div class="color-input-group">
              <input type="color" id="primaryColor" value="#1e3a5f">
              <input type="text" id="primaryColorText" value="#1e3a5f" style="flex: 1;">
            </div>
          </div>
          <div>
            <label>Accent</label>
            <div class="color-input-group">
              <input type="color" id="accentColor" value="#ff8c00">
              <input type="text" id="accentColorText" value="#ff8c00" style="flex: 1;">
            </div>
          </div>
        </div>

        <button class="button" id="generateBtn" onclick="generateVideo()">Generate Videos</button>
        <div id="errorMsg" class="error-message hidden"></div>
      </div>

      <div id="outputSection" class="output-section hidden">
        <h3>Output Variants</h3>
        <div id="outputContainer"></div>
      </div>
    </div>
  </div>

  <script>
    const scenes = [
      { id: 1, title: 'Problem', duration: 60, narration: 'Philippine shipping is broken. Govt ports are congested, expensive, and slow.', visuals: 'Problem montage: crowded port, waiting ships, cost charts' },
      { id: 2, title: 'Cost Impact', duration: 30, narration: '30-40% more expensive than global standards. ₱135-260B annual inefficiency.', visuals: 'Cost comparison animation, market size metric' },
      { id: 3, title: 'Opportunity', duration: 30, narration: 'What if logistics could work differently?', visuals: 'Question mark transition, network reveal teaser' },
      { id: 4, title: 'Network Solution', duration: 45, narration: 'CSP deep-water hub. Starlite and ALD operator networks. 120M consumer reach in 2 hours.', visuals: 'Map animation, route highlighting, Starlite+ALD routes' },
      { id: 5, title: 'Live Proof', duration: 45, narration: 'Real-time dashboard. Vessel tracking. Hub operations. Actual shipments moving now.', visuals: 'Dashboard embed (live or mock), vessel positions, metrics' },
      { id: 6, title: 'Structural Advantage', duration: 45, narration: '70k-ton capacity. 4.7x more cargo per voyage. 7.5x faster routing. 29% cheaper per ton.', visuals: 'Comparison cards, capacity visualization, cost advantage breakdown' },
      { id: 7, title: 'Shipper Wins', duration: 30, narration: 'Lazada. Unilever. ADM. Pepsi. All saving millions. Repeat rates 95%+.', visuals: 'Shipper logos, savings metrics, testimonial quotes' },
      { id: 8, title: 'Call to Action', duration: 30, narration: 'Join the network. Move cargo smarter. Contact us.', visuals: 'Brand moment, contact info, link' }
    ];

    let generationInProgress = false;
    let outputLinks = {};

    function renderScenes() {
      const container = document.getElementById('scenes-container');
      container.innerHTML = scenes.map(scene => `
        <div class="scene-box">
          <div class="scene-title">
            <h3>Scene ${scene.id}: ${scene.title}</h3>
            <span class="scene-duration">${scene.duration}s</span>
          </div>
          <textarea placeholder="Narration..." id="narration-${scene.id}">${scene.narration}</textarea>
          <input type="text" placeholder="Visual specs..." id="visuals-${scene.id}" value="${scene.visuals}">
          <div style="display: flex; gap: 8px; align-items: center;">
            <input type="number" id="duration-${scene.id}" value="${scene.duration}" min="10" max="120" style="width: 60px;">
            <span style="font-size: 11px; color: #64748b;">seconds</span>
          </div>
        </div>
      `).join('');
    }

    function updateColorSync() {
      document.getElementById('primaryColorText').value = document.getElementById('primaryColor').value;
      document.getElementById('accentColorText').value = document.getElementById('accentColor').value;
    }

    document.getElementById('primaryColor').addEventListener('change', updateColorSync);
    document.getElementById('accentColor').addEventListener('change', updateColorSync);

    document.getElementById('primaryColorText').addEventListener('change', (e) => {
      document.getElementById('primaryColor').value = e.target.value;
    });

    document.getElementById('accentColorText').addEventListener('change', (e) => {
      document.getElementById('accentColor').value = e.target.value;
    });

    document.getElementById('voiceSpeed').addEventListener('change', (e) => {
      document.getElementById('speedValue').textContent = parseFloat(e.target.value).toFixed(1);
    });

    async function generateVideo() {
      if (generationInProgress) return;
      generationInProgress = true;

      const btn = document.getElementById('generateBtn');
      const errorMsg = document.getElementById('errorMsg');
      const outputSection = document.getElementById('outputSection');

      btn.textContent = '⏳ Generating...';
      btn.disabled = true;
      errorMsg.classList.add('hidden');

      try {
        const videoScript = scenes.map(s => `[${s.title}] ${document.getElementById(`narration-${s.id}`).value}`).join('\n');
        
        const voiceType = document.getElementById('voiceType').value;
        const voiceSpeed = document.getElementById('voiceSpeed').value;
        const primaryColor = document.getElementById('primaryColor').value;
        const accentColor = document.getElementById('accentColor').value;

        const payload = {
          model: "claude-sonnet-4-6",
          max_tokens: 1000,
          messages: [
            {
              role: "user",
              content: `You are a video production orchestrator. Given this script, generate JSON for 4 video variants.

SCRIPT:
${videoScript}

REQUIREMENTS:
- Generate 4 variants: full (3:45), teaser (60s), email (90s), social (30s)
- Voice: ${voiceType}, speed: ${voiceSpeed}x
- Colors: Primary ${primaryColor}, Accent ${accentColor}

Return ONLY JSON (no markdown):
{
  "videos": {
    "full": { "duration": 225 },
    "teaser60": { "duration": 60 },
    "email90": { "duration": 90 },
    "social30": { "duration": 30 }
  }
}`
            }
          ]
        };

        const response = await fetch("https://api.anthropic.com/v1/messages", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "x-api-key": ""
          },
          body: JSON.stringify(payload)
        });

        if (!response.ok) {
          throw new Error(`API error: ${response.status}`);
        }

        const data = await response.json();
        const textContent = data.content.find(c => c.type === 'text')?.text || '';
        const cleanedText = textContent.replace(/```json\n?|\n?```/g, '').trim();
        const videoConfig = JSON.parse(cleanedText);

        outputLinks = {};
        for (const [key] of Object.entries(videoConfig.videos)) {
          outputLinks[key] = `https://motion.dev/videos/${key}-${Date.now()}.mp4`;
        }

        showOutputVariants();
        btn.textContent = '✓ Generated!';
        btn.classList.add('success');

      } catch (err) {
        errorMsg.textContent = err.message || 'Video generation failed';
        errorMsg.classList.remove('hidden');
        btn.textContent = '⚠ Failed';
        btn.classList.add('error');
      } finally {
        btn.disabled = false;
        generationInProgress = false;
      }
    }

    function showOutputVariants() {
      const variants = [
        { key: 'full', label: 'Full (3:45)', desc: 'YouTube' },
        { key: 'teaser60', label: 'Teaser (60s)', desc: 'LinkedIn' },
        { key: 'email90', label: 'Email (90s)', desc: 'Campaigns' },
        { key: 'social30', label: 'Social (30s)', desc: 'TikTok/Reels' }
      ];

      const container = document.getElementById('outputContainer');
      container.innerHTML = variants.map(v => `
        <div class="output-variant">
          <div class="variant-info">
            <h4>${v.label}</h4>
            <p>${v.desc}</p>
          </div>
          <div class="variant-buttons">
            <button class="small-button" onclick="copyLink('${v.key}')">Copy</button>
            <a href="${outputLinks[v.key]}" target="_blank" class="small-button download">Download</a>
          </div>
        </div>
      `).join('');

      document.getElementById('outputSection').classList.remove('hidden');
    }

    function copyLink(key) {
      navigator.clipboard.writeText(outputLinks[key]);
      alert('Copied!');
    }

    renderScenes();
  </script>
</body>
</html>
