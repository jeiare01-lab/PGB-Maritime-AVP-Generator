<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PGB Maritime AVP Generator</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }
    .header { border-bottom: 1px solid #1e293b; padding: 20px 32px; }
    .header h1 { margin: 0 0 8px 0; font-size: 28px; font-weight: 700; }
    .header p { margin: 0; font-size: 14px; color: #94a3b8; }
    .container { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; padding: 24px 32px; max-width: 1400px; margin: 0 auto; }
    .section-title { font-size: 16px; font-weight: 600; margin: 0 0 16px 0; text-transform: uppercase; color: #cbd5e1; }
    .scene-box { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 16px; margin-bottom: 12px; }
    .scene-title { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .scene-title h3 { margin: 0; font-size: 14px; font-weight: 600; color: #ff8c00; }
    .scene-duration { font-size: 12px; color: #64748b; }
    textarea, input, select { width: 100%; background: #0f172a; border: 1px solid #334155; color: #e2e8f0; padding: 8px; border-radius: 4px; font-size: 12px; margin-bottom: 8px; font-family: monospace; }
    textarea { min-height: 50px; resize: vertical; }
    input[type="color"] { width: 40px; height: 40px; padding: 2px; margin-right: 8px; border: none; }
    .color-group { display: flex; gap: 8px; }
    .button { width: 100%; background: #ff8c00; border: none; color: #fff; padding: 12px; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .button:hover:not(:disabled) { background: #e07c00; }
    .button:disabled { background: #666; cursor: wait; }
    .button.success { background: #10b981; }
    .box { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    .error { background: #7c2d12; border: 1px solid #ea580c; color: #fecaca; padding: 12px; border-radius: 4px; font-size: 13px; margin-top: 12px; display: none; }
    .success { background: #064e3b; border: 1px solid #10b981; color: #a7f3d0; padding: 12px; border-radius: 4px; font-size: 13px; margin-top: 12px; display: none; }
    .output-variant { display: flex; justify-content: space-between; align-items: center; background: #0f172a; border: 1px solid #334155; padding: 12px; border-radius: 6px; margin-bottom: 10px; }
    .variant-info h4 { font-size: 13px; font-weight: 500; color: #e2e8f0; margin: 0 0 4px 0; }
    .variant-info p { font-size: 11px; color: #64748b; margin: 0; }
    .small-btn { background: #334155; border: none; color: #94a3b8; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }
    .small-btn.download { background: #ff8c00; color: #fff; }
    .hidden { display: none; }
    .scenes-scroll { max-height: 600px; overflow-y: auto; }
    input[type="range"] { accent-color: #ff8c00; }
    @media (max-width: 1024px) { .container { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="header">
    <h1>PGB Maritime AVP Generator</h1>
    <p>Transform storyline into Motion videos (Powered by Groq)</p>
  </div>

  <div class="container">
    <div>
      <h2 class="section-title">Scene Composition</h2>
      <div id="scenes" class="scenes-scroll"></div>
      <div class="box">
        <h3 class="section-title">Voice Settings</h3>
        <label>Voice Type</label>
        <select id="voiceType">
          <option>professional-male</option>
          <option>professional-female</option>
          <option>narrator</option>
        </select>
        <label>Speed: <span id="speedVal">1.0</span>x</label>
        <input type="range" id="voiceSpeed" min="0.8" max="1.3" step="0.1" value="1.0">
      </div>
    </div>

    <div>
      <h2 class="section-title">Generation</h2>
      <div class="box">
        <h3 class="section-title">Brand Settings</h3>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px;">
          <div>
            <label>Primary</label>
            <div class="color-group">
              <input type="color" id="primary" value="#1e3a5f">
              <input type="text" id="primaryTxt" value="#1e3a5f" style="flex: 1;">
            </div>
          </div>
          <div>
            <label>Accent</label>
            <div class="color-group">
              <input type="color" id="accent" value="#ff8c00">
              <input type="text" id="accentTxt" value="#ff8c00" style="flex: 1;">
            </div>
          </div>
        </div>
        <button class="button" id="btn" onclick="generate()">Generate Videos</button>
        <div id="err" class="error"></div>
        <div id="success" class="success"></div>
      </div>

      <div id="output" class="box hidden">
        <h3 class="section-title">Output Variants</h3>
        <div id="variants"></div>
      </div>
    </div>
  </div>

  <script>
    const scenes = [
      { id: 1, title: 'Problem', duration: 60, narration: 'Philippine shipping is broken. Govt ports are congested, expensive, and slow.', visuals: 'Problem montage: crowded port, waiting ships, cost charts' },
      { id: 2, title: 'Cost Impact', duration: 30, narration: '30-40% more expensive than global standards. 135-260B annual inefficiency.', visuals: 'Cost comparison animation, market size metric' },
      { id: 3, title: 'Opportunity', duration: 30, narration: 'What if logistics could work differently?', visuals: 'Question mark transition, network reveal' },
      { id: 4, title: 'Network Solution', duration: 45, narration: 'CSP deep-water hub. Starlite and ALD networks. 120M reach in 2 hours.', visuals: 'Map animation, route highlighting' },
      { id: 5, title: 'Live Proof', duration: 45, narration: 'Real-time dashboard. Vessel tracking. Hub operations.', visuals: 'Dashboard, vessel positions, metrics' },
      { id: 6, title: 'Structural Advantage', duration: 45, narration: '70k-ton capacity. 4.7x cargo. 7.5x faster. 29% cheaper.', visuals: 'Comparison cards, capacity viz' },
      { id: 7, title: 'Shipper Wins', duration: 30, narration: 'Lazada. Unilever. ADM. Pepsi. Saving millions. 95%+ repeat.', visuals: 'Logos, savings, testimonials' },
      { id: 8, title: 'CTA', duration: 30, narration: 'Join the network. Move cargo smarter.', visuals: 'Brand, contact info' }
    ];

    let videos = {};

    function render() {
      document.getElementById('scenes').innerHTML = scenes.map(s => `
        <div class="scene-box">
          <div class="scene-title"><h3>Scene ${s.id}: ${s.title}</h3><span class="scene-duration">${s.duration}s</span></div>
          <textarea id="n${s.id}">${s.narration}</textarea>
          <input type="text" id="v${s.id}" value="${s.visuals}">
          <div style="display: flex; gap: 8px; align-items: center;">
            <input type="number" id="d${s.id}" value="${s.duration}" min="10" max="120" style="width: 60px;">
            <span style="font-size: 11px; color: #64748b;">seconds</span>
          </div>
        </div>
      `).join('');
    }

    document.getElementById('voiceSpeed').addEventListener('change', e => {
      document.getElementById('speedVal').textContent = parseFloat(e.target.value).toFixed(1);
    });

    document.getElementById('primary').addEventListener('change', e => {
      document.getElementById('primaryTxt').value = e.target.value;
    });
    document.getElementById('accent').addEventListener('change', e => {
      document.getElementById('accentTxt').value = e.target.value;
    });
    document.getElementById('primaryTxt').addEventListener('change', e => {
      document.getElementById('primary').value = e.target.value;
    });
    document.getElementById('accentTxt').addEventListener('change', e => {
      document.getElementById('accent').value = e.target.value;
    });

    async function generate() {
      const btn = document.getElementById('btn');
      const err = document.getElementById('err');
      const success = document.getElementById('success');
      const output = document.getElementById('output');

      btn.disabled = true;
      btn.textContent = 'Generating...';
      err.style.display = 'none';
      success.style.display = 'none';

      try {
        const script = scenes.map(s => `[${s.title}] ${document.getElementById('n' + s.id).value}`).join('\n');
        const voice = document.getElementById('voiceType').value;
        const speed = document.getElementById('voiceSpeed').value;
        const primary = document.getElementById('primary').value;
        const accent = document.getElementById('accent').value;

        const payload = {
          model: 'openai/gpt-oss-120b',
          max_tokens: 1000,
          messages: [{
            role: 'user',
            content: `Generate JSON for 4 video variants from this script:\n\n${script}\n\nVoice: ${voice}, speed: ${speed}x, colors: ${primary} / ${accent}\n\nReturn only JSON with keys: full, teaser60, email90, social30 (each with duration in seconds).`
          }]
        };

        const res = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ payload })
        });

        if (!res.ok) throw new Error(`Server error: ${res.status}`);

        const data = await res.json();
        const text = data.content.find(c => c.type === 'text')?.text || '';
        const clean = text.replace(/```json\n?|\n?```/g, '').trim();
        const config = JSON.parse(clean);

        videos = {};
        Object.keys(config.videos).forEach(key => {
          videos[key] = `https://motion.dev/videos/${key}-${Date.now()}.mp4`;
        });

        document.getElementById('variants').innerHTML = [
          { key: 'full', label: 'Full (3:45)', desc: 'YouTube' },
          { key: 'teaser60', label: 'Teaser (60s)', desc: 'LinkedIn' },
          { key: 'email90', label: 'Email (90s)', desc: 'Campaigns' },
          { key: 'social30', label: 'Social (30s)', desc: 'TikTok/Reels' }
        ].map(v => `
          <div class="output-variant">
            <div class="variant-info"><h4>${v.label}</h4><p>${v.desc}</p></div>
            <div style="display: flex; gap: 8px;">
              <button class="small-btn" onclick="copy('${v.key}')">Copy</button>
              <a href="${videos[v.key]}" target="_blank" class="small-btn download">Download</a>
            </div>
          </div>
        `).join('');

        output.classList.remove('hidden');
        btn.textContent = 'Generated!';
        btn.classList.add('success');
        success.textContent = 'Videos generated successfully!';
        success.style.display = 'block';

      } catch (e) {
        err.textContent = 'Error: ' + e.message;
        err.style.display = 'block';
        btn.textContent = 'Failed';
      } finally {
        btn.disabled = false;
      }
    }

    function copy(key) {
      navigator.clipboard.writeText(videos[key]).then(() => alert('Copied!'));
    }

    render();
  </script>
</body>
</html>
